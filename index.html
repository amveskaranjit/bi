<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embrace</title>
    <link rel="stylesheet" href="css/embrace.css" />
  </head>
  <body>

    <!-- Every section => .container div includeing header and footer -->
     <!-- navbar header -->

    <header>
      <div class="container">
        <div class="flex">
          <img src="images/logo.png" alt="Embrace Logo" />
          <nav>
            <a href="#">How it works</a>
            <a href="#">Our Work</a>
            <a href="#">Pricing</a>
            <a href="#">About</a>
          </nav>
          <button class="btn">Book A Call</button>
        </div>
      </div>
    </header>

    <!-- section -->

    <section>
      <div class="container">
        <div class="flex">
          <div>
            <h1>We take care of you brand</h1>
            <p>We care about your brand and we care about your clients.</p>

            <form>
              <input type="text" placeholder="Enter your email" />
              <button class="btn">Let's Talk</button>
            </form>

          </div>
          
          <div>
            <img src="images/intro image.png" />
          </div>
        </div>
      </div>
    </section>

    <section id="companies">
      <div class="container">
        <h2>Companies we work with</h2>
          <div id="company-logos">
            
            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div >
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>
            
            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

            <div>
              <img src="images/spotify.png" alt="companyname">
            </div>

          </div>
      </div>
    </section>

    <section id="work">
      <div class="container">
        <h2>Our Work</h2>
        <p>
          A glimpse of our portfolio
        </p>

        <!-- display: inline; -->
         <!-- a, label, img, span -->

        <div class="flex">
          <div>
            <img src="images/apple.png" alt="apple image">
            <p>Apple</p>
          </div>

          <div>
            <img src="images/cocacola.png" alt="cocacola image">
            <p>Cocacola</p>
          </div>

          <div>
            <img src="images/nike.png" alt="nike image">
            <p>Nike</p>
          </div>
        </div>

        <a href="#" class="btn">See More</a>

      </div>

    </section>

  </body>
</html>
